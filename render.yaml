services:
  - type: web
    name: personal-notes-qa-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: personal-notes-qa-db
          property: connectionString

  - type: web
    name: personal-notes-qa-web
    runtime: static
    buildCommand: cd client && npm ci --include=dev && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: personal-notes-qa-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free Render Postgres expires 30 days after creation. Upgrade the database
  # to a paid plan for permanent storage.
  - name: personal-notes-qa-db
    databaseName: personal_notes
    user: personal_notes
    plan: free
