services:
  - type: web
    name: personal-notes-q-a
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd server && npm ci --include=dev && npm run build && cd ../client && npm ci --include=dev && npm run build
    startCommand: node server/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: CLIENT_DIST_PATH
        value: ./client/dist
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: personal-notes-q-a-db
          property: connectionString

databases:
  # Free Render Postgres expires 30 days after creation. Upgrade the database
  # to a paid plan for permanent storage.
  - name: personal-notes-q-a-db
    databaseName: personal_notes
    user: personal_notes
    plan: free
    region: oregon
